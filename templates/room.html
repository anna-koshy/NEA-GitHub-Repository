{% extends 'base.html' %} {% block content %}
<div class="message-box">
  <div class = "row">
    <div class ="rules">
      <button type="button" onclick="alert('Game Rules: {placeholder content}')">Game Rules</button>
    </div>
  <div class="start">
    <button type="button" id="start-game" {% if not is_host %}hidden{% endif %} onClick=startGame()>Start Game</button>
  </div>
  </div>
  <h2> Host: {{host}}, Lobby: {{code}}</h2>
  <div class="messages" id="messages"></div>
  <div class="inputs">
    <input
      type="text"
      rows="3"
      placeholder="Message"
      name="message"
      id="message"
    />
    <button type="button" name="send" id="send-btn" onClick="sendMessage()">
      Send
    </button>
  </div>
</div>
<script type="text/javascript">
  var socketio = io();

  const messages = document.getElementById("messages");

  const createMessage = (name, msg) => {
    const content = `
    <div class="text">
        <span>
            <strong>${name}</strong>: ${msg}
        </span>
        <span class="muted">
            ${new Date().toLocaleString()}
        </span>
    </div>
    `;
    messages.innerHTML += content;
  };

  socketio.on("message", (data) => {
    createMessage(data.name, data.message);
  });

  const sendMessage = () => {
    const message = document.getElementById("message");
    if (message.value == "") return;
    socketio.emit("message", { data: message.value });
    message.value = "";
  };

  socketio.on("delete_room", () => {
    window.location.href = "/";
  });

  const startGame = () => {
    socketio.emit("start_game");
  };
  
  socketio.on("roleassignment", () => {
    window.location.href = "/roleassignment";
  });

  socketio.on("insufficient_players", () => {
    alert("There are not enough players in the lobby.");
  });

</script>
{% for msg in messages %}
<script type="text/javascript">
  createMessage("{{msg.name}}", "{{msg.message}}");
</script>
{% endfor %} {% endblock %}
