{% extends 'base.html' %} {% block content %}
<div class="message-box">
  <div class = "row">
    <div class ="rules">
      <button type="button" onclick="window.location.href='{{ url_for('rules') }}'">Game Rules</button>
    </div>
  <div class="start">
    <button type="button" id="start-game" {% if not is_host %}hidden{% endif %} onClick="startGame()">Start Game</button>
  </div>
  </div>
  <h2> Host: {{host}}, Names: {{names}}, Lobby: {{code}}</h2>
  <div class="messages" id="messages"></div>
  <div class="inputs">
    <input
      type="text"
      rows="3"
      placeholder="Message"
      name="message"
      id="message"
    />
    <button type="button" name="send" id="send-btn" onClick="sendMessage()">
      Send
    </button>
  </div>
</div>
<script type="text/javascript">
  var socketio = io();

  const messages = document.getElementById("messages");

  const createMessage = (name, msg) => {
    const content = `
    <div class="text">
        <span>
            <strong>${name}</strong>: ${msg}
        </span>
        <span class="muted">
            ${new Date().toLocaleString()}
        </span>
    </div>
    `;
    messages.innerHTML += content;
  };

  socketio.on("message", (data) => {
    createMessage(data.name, data.message);
  });

  const sendMessage = () => {
    const message = document.getElementById("message");
    if (message.value == "") return;
    socketio.emit("message", { data: message.value });
    message.value = "";
  };

  const currentPlayerName = {{ session["name"] | tojson }};

  socketio.on("update_players", (names) => {
    const playerList = document.getElementById("player-list");
    playerList.replaceChildren();

    names.forEach((name) => {
      const item = document.createElement("li");
      item.textContent = name;
      playerList.appendChild(item);
    });
  });
  socketio.on("delete_room", () => {
    window.location.href = "/";
  });
  

</script>
{% for msg in messages %}
<script type="text/javascript">
  createMessage("{{msg.name}}", "{{msg.message}}");
</script>
{% endfor %} {% endblock %}
